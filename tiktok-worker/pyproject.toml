[project]
name = "tiktok-worker"
version = "0.1.0"
description = "Host-side worker that drives a tethered Samsung phone to publish TikTok Stories from the content_items queue."
requires-python = ">=3.11"
dependencies = [
    "uiautomator2>=3.2",
    "supabase>=2.6",
    "pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "scipy>=1.13",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
tiktok-worker = "tiktok_worker.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiktok_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
